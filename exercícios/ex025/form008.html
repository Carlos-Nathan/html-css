<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.js" method="get">
        <div>
            <label for="in1">Número 1: </label>
            <input type="number" name="n1" id="in1" min="0" max="50" oninput="isoma.innerHTML = Number(n1.value) + Number(n2.value)" required>
        </div><br>
        <div>
            <label for="in2">Número 2: </label>
            <input type="number" name="n2" id="in2" min="0" max="50" oninput="isoma.innerHTML = Number(n1.value) + Number(n2.value)" required>
        </div><br>
        <div>
            <label for="isoma">soma: </label>
            <output name="soma" id="isoma">0</output>
        </div><br>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
</body>
</html>
